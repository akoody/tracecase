name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracecase
          POSTGRES_PASSWORD: tracecase
          POSTGRES_DB: tracecase
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tracecase -d tracecase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          TRACECASE_TEST_DATABASE_URL: postgres://tracecase:tracecase@127.0.0.1:55432/tracecase
      - run: pnpm skill:install-test
