name: tracecase
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracecase
      POSTGRES_PASSWORD: tracecase
      POSTGRES_DB: tracecase
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - tracecase-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracecase -d tracecase']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  tracecase-postgres:
